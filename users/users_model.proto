syntax = "proto3";

package users;
option go_package="github.com/GinciuuKitakaze/messenger-contracts/users/go;users";

import "google/protobuf/timestamp.proto";

message CreateUser {
  string name = 1;
  optional string email = 2;
  optional string phone = 3;
}

message User {
  string id = 1;
  int64 version = 2;
  string name = 3;
  optional string email = 4;
  optional string phone = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message UpdateUser {
  string name = 1;
  optional string email = 2;
  optional string phone = 3;
}